apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-250493330
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-250493330
  template:
    metadata:
      labels:
        app: nginx-250493330
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-250493330
spec:
  type: NodePort
  selector:
    app: nginx-250493330
  ports:
    - port: 80
      targetPort: 80
